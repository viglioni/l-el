# .github/workflows/release.yml
name: Auto Release on Tag

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)release, e.g. 1.2.0"
        required: true
        type: string

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: write

    steps:
      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "Release $TAG" \
            --generate-notes

      - name: Update latest-release branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -B latest-release
          git push origin latest-release --force

  # Only fires on tag push, not on manual dispatch — manual dispatch
  # requires a pre-existing tag, so deleting it would be destructive.
  cleanup-failed-tag:
    runs-on: ubuntu-latest
    needs: [test]
    if: failure() && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete failing tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin --delete ${{ github.ref_name }}
